name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: bckirkup/domain-runner
          path: domain-runner
      - uses: actions/checkout@v4
        with:
          repository: bckirkup/TattleTots
          path: TattleTots

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          # Pin third-party dependencies to verified versions and restrict pip to
          # pre-built wheels so installation never builds sdists / runs setup scripts
          # (SonarCloud githubactions:S8541 and githubactions:S8544).
          pip install --only-binary=:all: \
            "numpy==2.4.4" \
            "scipy==1.17.1" \
            "networkx==3.6.1" \
            "pydantic==2.13.4" \
            "pytest==9.1.1" \
            "pytest-cov==7.1.0" \
            "ruff==0.16.1" \
            "mypy==2.3.0"
          # First-party packages are installed editable with --no-deps so no
          # unpinned dependencies are resolved from these source checkouts. Their
          # version is fixed by the actions/checkout refs above, so S8544 (external
          # version locking) does not apply to these local source installs.
          pip install --only-binary=:all: --no-deps -e domain-runner  # NOSONAR(githubactions:S8544)
          pip install --only-binary=:all: --no-deps -e TattleTots  # NOSONAR(githubactions:S8544)
          pip install --only-binary=:all: --no-deps -e .  # NOSONAR(githubactions:S8544)

      - name: Lint with ruff
        run: |
          ruff check src/ tests/
          ruff format --check src/ tests/

      - name: Type check with mypy
        run: mypy src/

      - name: Run tests
        run: pytest --tb=short -q

      - name: Run smoke tests
        run: pytest -m smoke --tb=short -q
